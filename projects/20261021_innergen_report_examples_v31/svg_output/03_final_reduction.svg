<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" data-pptx-page-role="content">
<rect width="1040" height="720" fill="#FFFFFF"/>
<g id="header"><rect width="1040" height="69.3333" fill="#0F243F"/><path d="M0 23H1040 M0 46H1040 M260 0V69 M520 0V69 M780 0V69" stroke="#FFFFFF" stroke-opacity="0.06" fill="none"/><text x="33.3333" y="46" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">3. 산정방법과 검증자료 인계</text></g>
<g id="governing"><text x="33.3333" y="117" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#0F243F">시나리오 수식과 모니터링 인자를 검증 근거에 연결해 인계합니다.</text><line x1="33.3333" y1="155" x2="1006.6666" y2="155" stroke="#BFBFBF"/></g>
<g id="equations"><rect x="33.3333" y="183" width="648.6667" height="181" fill="#F2F2F2"/><text x="49" y="214" font-family="Malgun Gothic, sans-serif" font-size="17.333333333333332" font-weight="700" fill="#0F243F">가상 산정 구조 · 실제 방법론 확정 전</text><text id="reduction" x="49" y="262" font-family="Cambria Math" font-size="24" fill="#000000" data-pptx-equation="ER_y = BE_y - PE_y - LE_y">ER<tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline" font-size="24"> = BE</tspan><tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline" font-size="24"> − PE</tspan><tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline" font-size="24"> − LE</tspan><tspan baseline-shift="sub" font-size="14">y</tspan></text><text id="baseline" x="49" y="310" font-family="Cambria Math" font-size="24" fill="#000000" data-pptx-equation="BE_y = EG_y \times EF_{BL,y}">BE<tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline" font-size="24"> = EG</tspan><tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline" font-size="24"> × EF</tspan><tspan baseline-shift="sub" font-size="14">BL,y</tspan></text><text x="49" y="345" font-family="Malgun Gothic, sans-serif" font-size="14" fill="#595959">누출 배출량은 해당성 검토 후 산정 · 임의로 0 처리하지 않음</text></g>
<g id="handover" font-family="Malgun Gothic, sans-serif"><text x="706" y="207" font-size="17.333333333333332" font-weight="700" fill="#0F243F">수행방법 · 인계 순서</text><line x1="706" y1="221" x2="1006" y2="221" stroke="#BFBFBF"/><text x="723" y="248" font-size="16" fill="#000000">01 경계·방법론 확정</text><text x="723" y="280" font-size="14" fill="#595959">적용 조건·판본·기간 기록</text><text x="723" y="311" font-size="16" fill="#000000">02 인자·근거 연결</text><text x="723" y="343" font-size="14" fill="#595959">03 산정·검토·인계</text></g>
<g id="parameters" font-family="Malgun Gothic, sans-serif"><text x="33.3333" y="400" font-size="17.333333333333332" font-weight="700" fill="#0F243F">모니터링 인자 → 단위 → 자료 출처 → 확인 방법</text><rect x="33.3333" y="417" width="973.3333" height="33" fill="#0F243F"/><text x="49" y="440" font-size="14" font-weight="700" fill="#FFFFFF">기호</text><text x="176" y="440" font-size="14" font-weight="700" fill="#FFFFFF">정의 · 단위</text><text x="414" y="440" font-size="14" font-weight="700" fill="#FFFFFF">출처 · 수집 주기</text><text x="708" y="440" font-size="14" font-weight="700" fill="#FFFFFF">QA/QC · 확인 조건</text>
<line x1="33.3333" y1="491" x2="1006.6666" y2="491" stroke="#BFBFBF"/><line x1="33.3333" y1="532" x2="1006.6666" y2="532" stroke="#BFBFBF"/><line x1="33.3333" y1="573" x2="1006.6666" y2="573" stroke="#BFBFBF"/><line x1="33.3333" y1="614" x2="1006.6666" y2="614" stroke="#BFBFBF"/>
<text id="symbol-eg" x="49" y="477" font-family="Cambria Math" font-size="16" fill="#000000" data-pptx-equation="EG_y">EG<tspan baseline-shift="sub" font-size="12">y</tspan></text><text x="176" y="476" font-size="14" fill="#000000">순공급 전력량 · MWh/년</text><text x="414" y="476" font-size="14" fill="#000000">검침 원장 · 연속/월 집계</text><text x="708" y="476" font-size="14" fill="#000000">거래 기록 대조·계량기 관리</text>
<text id="symbol-ef" x="49" y="518" font-family="Cambria Math" font-size="16" fill="#000000" data-pptx-equation="EF_{BL,y}">EF<tspan baseline-shift="sub" font-size="12">BL,y</tspan></text><text x="176" y="517" font-size="14" fill="#000000">배출계수 · tCO₂e/MWh</text><text x="414" y="517" font-size="14" fill="#000000">방법론 지정 출처 · 적용 시 확인</text><text x="708" y="517" font-size="14" fill="#000000">지역·연도·판본·단위 대조</text>
<text id="symbol-pe" x="49" y="559" font-family="Cambria Math" font-size="16" fill="#000000" data-pptx-equation="PE_y">PE<tspan baseline-shift="sub" font-size="12">y</tspan></text><text x="176" y="558" font-size="14" fill="#000000">사업 배출량 · tCO₂e/년</text><text x="414" y="558" font-size="14" fill="#000000">사업 활동자료 · 방법론별 설정</text><text x="708" y="558" font-size="14" fill="#000000">하위 산정식·원자료 연결</text>
<text id="symbol-le" x="49" y="600" font-family="Cambria Math" font-size="16" fill="#000000" data-pptx-equation="LE_y">LE<tspan baseline-shift="sub" font-size="12">y</tspan></text><text x="176" y="599" font-size="14" fill="#000000">누출 배출량 · tCO₂e/년</text><text x="414" y="599" font-size="14" fill="#000000">해당성 평가 · 방법론별 설정</text><text x="708" y="599" font-size="14" fill="#000000">비해당·0 적용의 근거 보존</text></g>
<g id="source"><text x="33.3333" y="657" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#595959">가상 예시 · y는 산정연도 · 수치·계수 미입력 · 인계물: 산정파일·원자료·검토이력·방법론 판본</text></g>
