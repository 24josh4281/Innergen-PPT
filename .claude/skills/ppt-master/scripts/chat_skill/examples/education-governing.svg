<g id="card-2-body"><text id="card-2-body-carrier" x="556" y="325" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="17.33" font-weight="400" fill="#475569">상황에 맞는 판단 기준을 고릅니다<tspan x="556" dy="43" fill="#4285F4" font-weight="700">근거와 판단 과정을 설명합니다</tspan><tspan x="556" dy="43" fill="#475569">적용 결과를 점검합니다</tspan><tspan x="556" dy="43" fill="#475569">다음 행동과 확인 자료를 정합니다</tspan></text></g>
