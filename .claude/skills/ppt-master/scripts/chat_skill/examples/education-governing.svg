<g id="card-1-title"><text id="card-1-title-carrier" x="278" text-anchor="middle" y="157.4" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="14.67" font-weight="700" fill="#FFFFFF">핵심 개념</text></g>
<g id="card-1-body"><text id="card-1-body-carrier" x="72" y="325" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="17.33" font-weight="400" fill="#475569">개념과 적용 범위를 이해합니다<tspan x="72" dy="43" fill="#4285F4" font-weight="700">핵심 용어와 판단 기준을 확인합니다</tspan><tspan x="72" dy="43" fill="#475569">조건과 예외를 함께 정리합니다</tspan><tspan x="72" dy="43" fill="#475569">질문으로 이해 수준을 점검합니다</tspan></text></g>
